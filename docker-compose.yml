services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: transactional_wallet
      POSTGRES_USER: transactional_wallet
      POSTGRES_PASSWORD: transactional_wallet_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - transactional_wallet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transactional_wallet -d transactional_wallet"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  transactional_wallet_pgdata:
